# 课程专用独立 Nginx 配置：配合 nginx -p /tmp/modern-web-nginx -e error.log -c <本文件> 启动，不改动系统 /etc/nginx 与默认站点
pid nginx.pid;
error_log error.log notice;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log access.log;
    client_body_temp_path client_body;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    server {
        listen 127.0.0.1:8088;
        server_name localhost;

        # 1. 静态前端页面由本课独立 Nginx 实例从 /tmp/modern-web-nginx/www 返回
        root www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 2. /api/ 路径反代给本机 9000 端口的 JSON API 后端
        # 注意 proxy_pass 末尾没有斜杠：Nginx 会把完整 URI (/api/...) 原样传给上游
        location /api/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
