            - heading "常见误区与工程边界" [level=2] [ref=e760]
            - link "Section titled “常见误区与工程边界”" [ref=e761] [cursor=pointer]:
              - /url: "#常见误区与工程边界"
          - list [ref=e766]:
            - listitem [ref=e767]:
              - strong [ref=e768]: 名词数量增长反映分工细化：
              - text: 每个名词对应一类可单独设计和验证的失败模式，学习时先问“它解决什么失败”。
            - listitem [ref=e769]:
              - strong [ref=e770]: RAG 优先于微调处理知识问题：
              - text: 事实放检索层可随时更新；微调固化行为模式，注入事实是方向性错误。
            - listitem [ref=e771]:
              - strong [ref=e772]: RAG 2.0 与 Stateless MCP 是新说法：
              - text: 前者出自厂商定义，后者出自协议修订；使用前先对齐所指。
            - listitem [ref=e773]:
              - strong [ref=e774]: 向量检索是近似检索：
              - text: ANN 索引用召回率换速度，关键场景要度量召回率并考虑混合检索。
            - listitem [ref=e775]:
              - strong [ref=e776]: 合成数据需要治理：
              - text: 有 phi-4 式的成功配方，也有模型坍缩的失败证明，差别在筛选、配比和真实数据混合。
            - listitem [ref=e777]:
              - strong [ref=e778]: 单次通过不是评测证据：
              - text: 随机系统要看多次 trial 的成功率与波动，轨迹与最终状态分开评。
            - listitem [ref=e779]:
              - strong [ref=e780]: LLM 评审自身带偏差：
              - text: 位置、冗长、自我增强三类偏差需要换序与人工校准对照。
            - listitem [ref=e781]:
              - strong [ref=e782]: 护栏挡不住全部注入：
              - text: OWASP 明确 RAG 与微调不能完全缓解提示注入，防线要叠加权限收敛与人工确认。
            - listitem [ref=e783]:
              - strong [ref=e784]: 可观测性约定仍在变化：
              - text: gen_ai 语义约定处于 Development 状态，选型时保留属性迁移的余地。
            - listitem [ref=e785]:
              - strong [ref=e786]: 缓存收益依赖前缀稳定：
              - text: 动态内容混入前缀会让写入费白付，先分离稳定段再开缓存。
          - complementary "重点结论" [ref=e787]:
            - paragraph [ref=e788]: KEY TAKEAWAY
            - heading "重点结论" [level=2] [ref=e789]
            - paragraph [ref=e790]: 2026 年的 AI 工程名词清单按五层阅读：能力接入解决模型调用外部世界，知识与记忆解决窗口之外的信息，模型定制解决行为固化与压缩，质量与安全在上线前后各设一道闸，运行与成本把系统当生产服务运营。名词会继续增加，五层框架和“它解决什么失败”这个问题保持稳定。
