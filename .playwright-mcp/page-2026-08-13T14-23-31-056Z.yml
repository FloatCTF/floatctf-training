                  - cell "语义相似、跨措辞检索" [ref=e466]
          - paragraph [ref=e467]: 生产检索常把两者组合：先用结构化条件过滤，再在候选集内做向量相似度排序；纯关键词与纯语义检索的混合（hybrid search）也很常见。
          - generic [ref=e468]:
            - heading "4. Memory Layers：跨会话的分层记忆" [level=3] [ref=e469]
            - link "Section titled “4. Memory Layers：跨会话的分层记忆”" [ref=e470] [cursor=pointer]:
              - /url: "#4-memory-layers跨会话的分层记忆"
          - paragraph [ref=e475]:
            - text: 上下文窗口是模型唯一直接可见的信息面，容量有限且每轮重算。要让应用记住跨会话的事实，需要把记忆放到窗口之外并按需取回。MemGPT 给出了被广泛引用的设计：把上下文窗口类比操作系统主存，外部存储类比磁盘，模型通过函数调用在两级之间分页——把重要事实写入外部记忆，需要时再检索回窗口。（来源：
            - 'link "MemGPT: Towards LLMs as Operating Systems" [ref=e476] [cursor=pointer]':
              - /url: "#source-memgpt-paper"
            - text: ）
          - complementary "先建立直觉" [ref=e477]:
            - paragraph [ref=e478]: INTUITION
            - heading "先建立直觉" [level=2] [ref=e479]
            - paragraph [ref=e480]: 操作系统用分页让程序以为内存无限大；分层记忆让模型以为上下文无限长。两者的共同点是把“放不下”变成“按需换入换出”，代价都是访问外层更慢，且换入策略决定质量。
          - paragraph [ref=e481]: 工程上记忆通常分层管理：本轮对话在窗口内；近期轮次的摘要作为工作记忆随时注入；长期事实（用户偏好、历史决定）写入外部存储，靠检索或显式读取返回。记忆写入什么、何时遗忘、检索错了怎么纠正，都是这一层的设计对象。
          - generic [ref=e482]:
            - heading "四、模型定制工程：什么时候需要动参数" [level=2] [ref=e483]
            - link "Section titled “四、模型定制工程：什么时候需要动参数”" [ref=e484] [cursor=pointer]:
              - /url: "#四模型定制工程什么时候需要动参数"
          - generic [ref=e489]:
            - heading "1. 三种优化手段的分工" [level=3] [ref=e490]
            - link "Section titled “1. 三种优化手段的分工”" [ref=e491] [cursor=pointer]:
              - /url: "#1-三种优化手段的分工"
          - paragraph [ref=e496]:
            - text: OpenAI 的官方优化指南给出明确顺序：先用 Prompt Engineering 建立评测基线；模型缺上下文时用 RAG 补知识；行为不一致时用微调固化模式；两种手段可以叠加使用。（来源：
            - link "Optimizing LLM Accuracy" [ref=e497] [cursor=pointer]:
              - /url: "#source-openai-accuracy-guide"
            - text: ）
          - figure "按失败类型选择优化手段" [ref=e498]:
