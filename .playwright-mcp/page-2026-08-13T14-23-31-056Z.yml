            - generic "2026 年技能栈分层定义" [ref=e168]:
              - article [ref=e169]:
                - strong [ref=e170]: 能力接入
                - list [ref=e171]:
                  - listitem [ref=e172]: Function Calling：开发者用 JSON Schema 声明函数，模型输出结构化调用意图，实际执行留在应用侧。（本课 · 二、能力接入层）
                  - listitem [ref=e173]: Tool Use：模型在推理过程中调用外部工具获取信息或执行动作的统称。（本课 · 二、能力接入层）
                  - listitem [ref=e174]: MCP：用开放协议标准化模型应用与外部数据、工具之间的能力交换。（《AI Agent 工程方法》· 二、MCP）
                  - listitem [ref=e175]: Stateless MCP：去除协议级会话的 MCP 服务器形态，任何实例可处理任何请求，便于水平扩展。（本课 · 二、能力接入层）
              - article [ref=e176]:
                - strong [ref=e177]: 执行编排
                - list [ref=e178]:
                  - listitem [ref=e179]: Prompt Optimization：以评测为依据迭代指令、示例与输出契约，收敛模型行为。（《AI Agent 工程方法》· 一、Prompt Engineering）
                  - listitem [ref=e180]: Context Engineering：为每一轮调用选择、压缩、隔离进入上下文窗口的信息。（《AI Agent 工程方法》· 四、Context Engineering）
                  - listitem [ref=e181]: Agentic AI：由模型动态决定过程与工具使用的应用形态。（《AI Agent 工程方法》· 六、Loop Engineering）
                  - listitem [ref=e182]: Harness：模型周围的工具、权限、验证、执行环境与可观测性构成的工作系统。（《AI Agent 工程方法》· 五、Harness Engineering）
                  - listitem [ref=e183]: Loop Engineering：让行动接受外部反馈，可重试、可恢复，并按明确条件停止。（《AI Agent 工程方法》· 六、Loop Engineering）
                  - listitem [ref=e184]: Graph Engineering：把节点、边、共享状态与人工检查点编排成可执行拓扑。（《AI Agent 工程方法》· 七、Graph Engineering）
                  - listitem [ref=e185]: Multi-Agent Systems：多个 Agent 在编排结构下分工、并行与汇合。（《AI Agent 工程方法》· 七、Graph Engineering）
              - article [ref=e186]:
                - strong [ref=e187]: 知识与记忆
                - list [ref=e188]:
                  - listitem [ref=e189]: RAG 2.0：检索增强生成，以及把检索器与模型端到端联合优化的新说法。（本课 · 三、知识与记忆工程）
                  - listitem [ref=e190]: Vector DBs：存储嵌入向量并用近似最近邻索引支持语义检索的数据库。（本课 · 三、知识与记忆工程）
                  - listitem [ref=e191]: Memory Layers：把窗口之外的信息分层存储，由模型分页读写的记忆机制。（本课 · 三、知识与记忆工程）
              - article [ref=e192]:
                - strong [ref=e193]: 模型定制
                - list [ref=e194]:
                  - listitem [ref=e195]: Fine-Tuning：用标注样本继续训练模型参数，固化风格、格式与任务行为。（本课 · 四、模型定制工程）
                  - listitem [ref=e196]: Distillation：用教师模型的输出分布训练更小、更便宜的学生模型。（本课 · 四、模型定制工程）
                  - listitem [ref=e197]: Synthetic Data：用模型生成训练数据，扩充语料并定向补强能力。（本课 · 四、模型定制工程）
              - article [ref=e198]:
                - strong [ref=e199]: 质量与安全
                - list [ref=e200]:
                  - listitem [ref=e201]: Evaluation Frameworks：用数据集、评分器与回归门禁在改动上线前度量质量。（本课 · 五、质量与安全工程）
                  - listitem [ref=e202]: Guardrails：在输入与输出两侧拦截注入、越权与违规内容的运行时防线。（本课 · 五、质量与安全工程）
              - article [ref=e203]:
                - strong [ref=e204]: 运行与成本
                - list [ref=e205]:
                  - listitem [ref=e206]: Observability：用 trace 与指标还原每次请求的执行路径、token 用量与成本。（本课 · 六、运行与成本治理）
                  - listitem [ref=e207]: AI Gateways：应用与多个模型提供商之间的统一入口与控制面。（本课 · 六、运行与成本治理）
                  - listitem [ref=e208]: Cost Optimization：用缓存、模型分级路由与预算控制管理推理成本。（本课 · 六、运行与成本治理）
            - generic [ref=e209]: 名词数量的增长反映分工细化：模型没有替代工程，而是把工程对象从指令扩展到了数据、执行、质量和成本。
