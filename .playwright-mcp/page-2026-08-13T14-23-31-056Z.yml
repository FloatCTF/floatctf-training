                  - cell "指令问题" [ref=e508]
                  - cell "格式漂移、理解偏差" [ref=e509]
                  - cell "Prompt" [ref=e510]
                  - cell "任务规格不清，改规格成本最低" [ref=e511]
                - row [ref=e512]:
                  - cell "知识缺失" [ref=e513]
                  - cell "编造事实、信息过期" [ref=e514]
                  - cell "RAG" [ref=e515]
