              - generic [ref=e377]: ──────────────── ────────────────
              - generic [ref=e379]: 请求携带 Mcp-Session-Id 每个请求自包含
              - generic [ref=e381]: 会话固定在某个实例 任何实例可处理任何请求
              - generic [ref=e383]: 负载均衡需要粘性路由 普通轮询即可
              - generic [ref=e385]: 实例下线丢失会话状态 实例随时增减、滚动发布
            - button "Copy to clipboard" [ref=e388] [cursor=pointer]
          - paragraph [ref=e390]: 会话曾经把一个客户端绑定到一台服务器实例，水平扩展需要粘性路由或共享会话存储。移除协议级会话后，MCP 服务器可以像普通无状态 Web 服务一样放在负载均衡后面伸缩。需要跨请求连续性的场景，状态外置到共享存储或放进请求本身。“Stateless MCP”作为名词流行，背后就是这条规范演进线。
          - generic [ref=e391]:
            - heading "三、知识与记忆工程：模型怎样获得窗口之外的信息" [level=2] [ref=e392]
            - link "Section titled “三、知识与记忆工程：模型怎样获得窗口之外的信息”" [ref=e393] [cursor=pointer]:
              - /url: "#三知识与记忆工程模型怎样获得窗口之外的信息"
          - generic [ref=e398]:
            - heading "1. RAG：用检索增强生成" [level=3] [ref=e399]
            - link "Section titled “1. RAG：用检索增强生成”" [ref=e400] [cursor=pointer]:
              - /url: "#1-rag用检索增强生成"
          - paragraph [ref=e405]:
            - text: 模型参数里的知识在训练截止后固定，更新知识、提供出处都很困难。RAG（Retrieval-Augmented Generation）由 Lewis 等人在 2020 年提出：预训练 seq2seq 模型充当参数化记忆，外部向量索引充当非参数化记忆，检索到的文档作为生成条件；替换索引就能更新模型可用的知识。（来源：
            - link "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks" [ref=e406] [cursor=pointer]:
              - /url: "#source-rag-paper"
            - text: ）
          - paragraph [ref=e407]: 生产中的 RAG 管线通常包含五步：
          - figure [ref=e409]:
            - code [ref=e411]:
              - generic [ref=e412]: 文档入库：切分（chunking）→ 嵌入（embedding）→ 写入向量索引
              - generic [ref=e414]: 在线查询：问题嵌入 → 近似检索 top-k → 重排（rerank）→ 拼入上下文 → 生成
            - button "Copy to clipboard" [ref=e417] [cursor=pointer]
          - paragraph [ref=e419]: 每一步都有可调参数：切分粒度决定召回单位，嵌入模型决定语义空间，top-k 与重排决定进入窗口的证据质量。检索质量差时，模型会在错误证据上流畅地给出错误答案，这类失败要在检索侧修，改 Prompt 无效。
          - generic [ref=e420]:
            - heading "2. RAG 2.0：从拼装到端到端" [level=3] [ref=e421]
            - link "Section titled “2. RAG 2.0：从拼装到端到端”" [ref=e422] [cursor=pointer]:
              - /url: "#2-rag-20从拼装到端到端"
          - note "术语成熟度" [ref=e427]:
            - paragraph [ref=e428]: INFORMATION
            - heading "术语成熟度" [level=3] [ref=e429]
            - paragraph [ref=e430]:
              - text: RAG 2.0 是 Contextual AI 在 2024 年 3 月提出的厂商说法，指把检索器与语言模型作为一个系统端到端联合训练，区别于把冻结的嵌入模型、向量库和黑盒模型拼在一起的传统管线。（来源：
              - link "Introducing RAG 2.0" [ref=e431] [cursor=pointer]:
                - /url: "#source-rag2-contextual"
              - text: ）社区语境中这个词也被泛化用来指代混合检索、重排和 Agentic 检索等增强管线，使用时先确认对方指哪一种。
          - paragraph [ref=e432]: 无论采用哪种定义，它指向的工程问题是一致的：拼装式 RAG 的各组件独立优化，误差沿管线累积；把检索与生成当成一个整体来评测和调优，才能解决“检索的东西模型用不好”这类跨组件失败。
          - generic [ref=e433]:
            - heading "3. 向量数据库：语义检索的索引" [level=3] [ref=e434]
            - link "Section titled “3. 向量数据库：语义检索的索引”" [ref=e435] [cursor=pointer]:
              - /url: "#3-向量数据库语义检索的索引"
          - paragraph [ref=e440]: RAG 的检索建立在向量相似度上：文本经嵌入模型映射成高维向量，语义相近的文本向量距离更近。向量数据库存储这些向量，并解决规模问题——在数亿向量里做精确最近邻搜索需要逐一比较，代价随规模线性增长。
          - paragraph [ref=e441]:
            - text: 主流方案使用近似最近邻（ANN）索引。HNSW 用分层近邻图组织向量：上层图稀疏、跳跃距离大，下层图稠密、定位精确，查询从上层入口逐层下降，复杂度对数级；代价是结果是近似的，可能漏掉个别真实最近邻。（来源：
            - link "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs" [ref=e442] [cursor=pointer]:
              - /url: "#source-hnsw-paper"
            - text: ）
          - figure "向量检索与传统数据库检索" [ref=e443]:
            - generic "向量检索与传统数据库检索，可横向滚动" [ref=e445]:
              - table [ref=e446]:
                - row [ref=e447]:
                  - columnheader "维度" [ref=e448]
