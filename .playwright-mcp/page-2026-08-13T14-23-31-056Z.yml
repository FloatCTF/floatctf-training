            - heading "七、一次请求的完整旅程" [level=2] [ref=e708]
            - link "Section titled “七、一次请求的完整旅程”" [ref=e709] [cursor=pointer]:
              - /url: "#七一次请求的完整旅程"
          - paragraph [ref=e714]: 五层名词在一次真实请求里同时出场。沿时间线走一遍，全景地图就落到了地面：
          - region "一次客服请求穿过全部工程层" [ref=e715]:
            - heading "一次客服请求穿过全部工程层" [level=3] [ref=e716]
            - list [ref=e717]:
              - listitem [ref=e718]:
                - generic [ref=e719]: "01"
                - generic [ref=e720]:
                  - strong [ref=e721]: 网关接入
                  - paragraph [ref=e722]: 统一入口完成鉴权、限流和模型路由，请求进入日志与用量统计。
              - listitem [ref=e723]:
                - generic [ref=e724]: "02"
                - generic [ref=e725]:
                  - strong [ref=e726]: 输入护栏
                  - paragraph [ref=e727]: Input rails 检查提示注入、敏感数据和话题边界，拒绝或改写可疑输入。
              - listitem [ref=e728]:
                - generic [ref=e729]: "03"
                - generic [ref=e730]:
                  - strong [ref=e731]: 组装上下文
                  - paragraph [ref=e732]: 读取分层记忆、检索知识库，把稳定前缀与缓存边界对齐。
              - listitem [ref=e733]:
                - generic [ref=e734]: "04"
                - generic [ref=e735]:
                  - strong [ref=e736]: 模型推理
                  - paragraph [ref=e737]: 命中缓存的前缀按低倍率计费，模型给出回答或工具调用意图。
              - listitem [ref=e738]:
                - generic [ref=e739]: "05"
                - generic [ref=e740]:
                  - strong [ref=e741]: 工具执行
                  - paragraph [ref=e742]: 应用解析结构化调用，经 MCP 或内部函数执行后把结果回传模型。
              - listitem [ref=e743]:
                - generic [ref=e744]: "06"
                - generic [ref=e745]:
                  - strong [ref=e746]: 输出护栏
                  - paragraph [ref=e747]: Output rails 校验格式、事实边界和敏感内容，不合格输出被拦截。
              - listitem [ref=e748]:
                - generic [ref=e749]: "07"
                - generic [ref=e750]:
                  - strong [ref=e751]: 记录轨迹
                  - paragraph [ref=e752]: Trace 记下每个 span 的耗时、token 用量与成本，构成可回放的执行证据。
              - listitem [ref=e753]:
                - generic [ref=e754]: "08"
                - generic [ref=e755]:
                  - strong [ref=e756]: 回流评测
                  - paragraph [ref=e757]: 线上失败案例进入评测集，驱动下一轮 Prompt、检索或微调改动。
          - paragraph [ref=e758]: 八步对应五层：第 1 步是运行与成本治理的入口，第 2、6 步是质量与安全，第 3 步是知识与记忆，第 4、5 步是能力接入与执行编排，第 7、8 步把运行数据送回评测，闭环回到质量层。模型定制层不在请求路径上，它在离线一侧消化第 8 步积累的失败案例。
