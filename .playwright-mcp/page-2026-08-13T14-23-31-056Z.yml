                  - cell "微调管行为，检索管事实，互补叠加" [ref=e526]
          - paragraph [ref=e527]: 常见的方向性错误是用微调注入事实。事实会过期，检索层换个索引就能更新；写进参数的内容更新一次要重训一次。
          - generic [ref=e528]:
            - heading "2. 微调与 LoRA" [level=3] [ref=e529]
            - link "Section titled “2. 微调与 LoRA”" [ref=e530] [cursor=pointer]:
              - /url: "#2-微调与-lora"
          - paragraph [ref=e535]:
            - text: 监督微调（SFT）用标注样本继续训练模型。OpenAI 的官方流程把评测放在最前面：先有可靠的评测，再构建训练数据集、创建微调任务、对照基线验证效果。（来源：
            - link "Supervised fine-tuning" [ref=e536] [cursor=pointer]:
              - /url: "#source-openai-sft-guide"
            - text: ）没有评测就无法回答“微调后是否更好”。
          - paragraph [ref=e537]:
            - text: 全参数微调在大模型上代价高。LoRA 冻结预训练权重 W，把权重更新量表示为低秩分解 ΔW = BA，只训练小矩阵 B 和 A。在 GPT-3 175B 上，LoRA 把可训练参数量降低约一万倍；部署时 BA 可以合并回 W，推理不增加延迟。（来源：
            - 'link "LoRA: Low-Rank Adaptation of Large Language Models" [ref=e538] [cursor=pointer]':
              - /url: "#source-lora-paper"
            - text: ）开源模型的定制大多走 LoRA 一类参数高效方法，训练产物是体积很小的适配器文件。
          - generic [ref=e539]:
            - heading "3. 蒸馏：把大模型压进小模型" [level=3] [ref=e540]
            - link "Section titled “3. 蒸馏：把大模型压进小模型”" [ref=e541] [cursor=pointer]:
              - /url: "#3-蒸馏把大模型压进小模型"
          - paragraph [ref=e546]:
            - text: 知识蒸馏由 Hinton 等人在 2015 年提出：用大模型或模型集成（教师）的软化输出分布训练小模型（学生），软标签携带类别间的相对关系，比硬标签的信息更多，能把教师的知识压缩进更容易部署的学生模型。（来源：
            - link "Distilling the Knowledge in a Neural Network" [ref=e547] [cursor=pointer]:
              - /url: "#source-distillation-paper"
            - text: ）
          - paragraph [ref=e548]: 在 LLM 生产中，蒸馏的动机主要是成本与延迟：让小模型在一个收窄的任务上逼近大模型质量，推理成本下降一个数量级。它与微调常常组合出现——用大模型生成任务数据，再微调小模型，就是一种蒸馏形态。
          - generic [ref=e549]:
            - heading "4. 合成数据：飞轮与坍缩" [level=3] [ref=e550]
            - link "Section titled “4. 合成数据：飞轮与坍缩”" [ref=e551] [cursor=pointer]:
              - /url: "#4-合成数据飞轮与坍缩"
          - paragraph [ref=e556]:
            - text: 合成数据指用模型生成训练数据。它已经支撑起真实的训练配方：phi-4 在预训练中把约 40% 的 token 分配给合成数据，用多智能体提示、自修订和指令反转等方法生成，合成数据构成其训练数据的主体。（来源：
            - link "Phi-4 Technical Report" [ref=e557] [cursor=pointer]:
              - /url: "#source-phi4-report"
            - text: ）
          - paragraph [ref=e558]:
            - text: 合成数据同时有被证明的失败模式。Nature 2024 的研究表明：无差别地用模型生成数据递归训练，会引发模型坍缩——原始分布的尾部信息不可逆地消失，模型逐代收敛到低方差的失真分布；真实人类数据的价值因此上升。（来源：
            - link "AI models collapse when trained on recursively generated data" [ref=e559] [cursor=pointer]:
              - /url: "#source-model-collapse-nature"
            - text: ）工程含义直接：合成数据要经过筛选、配比并混合真实数据，生成数据的来源要可追踪。
          - generic [ref=e560]:
            - heading "五、质量与安全工程：上线前与运行中的两道闸" [level=2] [ref=e561]
            - link "Section titled “五、质量与安全工程：上线前与运行中的两道闸”" [ref=e562] [cursor=pointer]:
              - /url: "#五质量与安全工程上线前与运行中的两道闸"
          - generic [ref=e567]:
            - heading "1. 评测框架：把“感觉变好了”变成回归门禁" [level=3] [ref=e568]
            - link "Section titled “1. 评测框架：把“感觉变好了”变成回归门禁”" [ref=e569] [cursor=pointer]:
              - /url: "#1-评测框架把感觉变好了变成回归门禁"
          - paragraph [ref=e574]: 评测框架由三部分组成：代表真实任务的数据集、给输出打分的评分器、把分数变成放行或阻断决定的门禁。改动 Prompt、检索或模型版本后跑同一套评测，才能区分改进与倒退。
          - paragraph [ref=e575]:
            - text: Agent 类系统的评测还要区分两个对象：执行轨迹（过程是否合理）与环境最终状态（结果是否正确），并且因为系统随机，需要多次 trial 观察成功率与波动，单次通过不构成证据。（来源：
            - link "Demystifying evals for AI agents" [ref=e576] [cursor=pointer]:
              - /url: "#source-anthropic-agent-evals"
            - text: ）
          - generic [ref=e577]:
            - heading "2. LLM-as-a-judge：用模型给模型打分" [level=3] [ref=e578]
            - link "Section titled “2. LLM-as-a-judge：用模型给模型打分”" [ref=e579] [cursor=pointer]:
              - /url: "#2-llm-as-a-judge用模型给模型打分"
          - paragraph [ref=e584]:
            - text: 开放式输出难以用规则打分，人工评审贵而慢。Zheng 等人在 MT-Bench 与 Chatbot Arena 上验证了折中方案：GPT-4 作为评审与人类偏好的一致率超过 80%，与人类互相之间的一致率相当。同一研究也量化了偏差：位置偏差（偏向先出现的答案）、冗长偏差（偏向更长的答案）、自我增强偏差（偏向自己生成的答案），需要用交换顺序等手段缓解。（来源：
            - link "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena" [ref=e585] [cursor=pointer]:
              - /url: "#source-llm-judge-paper"
            - text: ）
          - note "评审模型也要被评测" [ref=e586]:
            - paragraph [ref=e587]: WARNING
            - heading "评审模型也要被评测" [level=3] [ref=e588]
            - paragraph [ref=e589]: LLM 评审是带偏差的测量仪器。上线一个自动评分器之前，先在人工标注的子集上核对它与人类判断的一致率，再决定信任范围。
          - generic [ref=e590]:
            - heading "3. Guardrails：运行时的输入输出防线" [level=3] [ref=e591]
            - link "Section titled “3. Guardrails：运行时的输入输出防线”" [ref=e592] [cursor=pointer]:
              - /url: "#3-guardrails运行时的输入输出防线"
          - paragraph [ref=e597]:
            - text: 评测在上线前度量质量，Guardrails 在运行中兜住每一次请求。NeMo Guardrails 把可编程护栏分为五类轨道：输入、检索、对话、执行、输出，分别在一次交互的对应阶段拦截、改写或拒绝内容。（来源：
            - link "NVIDIA NeMo Guardrails Library Overview" [ref=e598] [cursor=pointer]:
              - /url: "#source-nemo-guardrails-docs"
            - text: ）
          - paragraph [ref=e599]:
            - text: 护栏针对的头号威胁有明确排名：OWASP 把提示注入列为 LLM 应用十大风险之首（LLM01:2025），分为直接注入（攻击者直接输入恶意指令）与间接注入（恶意指令藏在模型读取的网页、文档里）；RAG 与微调都不能完全缓解提示注入。（来源：
            - link "OWASP Top 10 for LLM Applications 2025" [ref=e600] [cursor=pointer]:
              - /url: "#source-owasp-llm-top10"
            - text: ）
