            - text: ChatGPT 于 2022 年 11 月 30 日发布。（来源：
            - link "Introducing ChatGPT" [ref=e92] [cursor=pointer]:
              - /url: "#source-openai-chatgpt-launch"
            - text: ）那一年入门 AI 应用的清单很短：会用对话模型，会写 Prompt。到 2026 年，同类岗位的要求已经展开成一长串名词——Harness、RAG 2.0、Guardrails、AI Gateway、Distillation。工程师社群用两个身高悬殊的剪影调侃这种膨胀。
          - paragraph [ref=e93]: 名词变多的原因值得认真回答。模型能力增强后，应用把更多环节交给模型，每个环节的可靠性、知识、质量、安全和成本问题就都变成了工程对象。下面的对照图重建了这份清单，每一项都可以点开看定义和它在课程路径中的位置。
