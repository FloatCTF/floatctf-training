                  - cell "评测集 + 评分器 + CI 门禁" [ref=e623]
                  - cell "输入/输出轨道 + 分类器" [ref=e624]
          - paragraph [ref=e625]: 两道闸互相补位：评测挡不住上线后的新型注入，护栏也不能证明系统整体变好了。提示注入的攻击构造与防御纵深在 Web 安全分类的课程里有更完整的展开。
          - generic [ref=e626]:
            - heading "六、运行与成本治理：把系统当生产服务运营" [level=2] [ref=e627]
            - link "Section titled “六、运行与成本治理：把系统当生产服务运营”" [ref=e628] [cursor=pointer]:
              - /url: "#六运行与成本治理把系统当生产服务运营"
          - generic [ref=e633]:
            - heading "1. 可观测性：还原每一次请求的执行路径" [level=3] [ref=e634]
            - link "Section titled “1. 可观测性：还原每一次请求的执行路径”" [ref=e635] [cursor=pointer]:
              - /url: "#1-可观测性还原每一次请求的执行路径"
          - paragraph [ref=e640]: 一次 Agent 请求可能跨越网关、多轮模型调用、若干工具执行。出问题时需要回答：哪一步慢、哪一步错、token 花在哪。分布式追踪的做法是给每个环节建 span，串成一条 trace。
          - paragraph [ref=e641]:
            - text: OpenTelemetry 正在为生成式 AI 制定 gen_ai 语义约定，统一模型调用、Agent 与工具调用的 span 命名和 token 用量属性；这套约定已迁入独立仓库维护，整体仍处于 Development 状态，字段可能继续变化。（来源：
            - link "OpenTelemetry GenAI semantic conventions repository" [ref=e642] [cursor=pointer]:
              - /url: "#source-otel-genai-repo"
            - text: ）选型时优先支持该约定的框架与平台，但要预期属性名会随版本迁移。
          - figure [ref=e644]:
            - code [ref=e646]:
              - generic [ref=e647]: "trace: 客服请求 #8f2a（总耗时 6.8s，总 token 21,430）"
              - generic [ref=e649]: "├── span: gateway.route 120ms"
              - generic [ref=e651]: "├── span: guardrails.input 80ms"
              - generic [ref=e653]: "├── span: retrieval.search 340ms top-k=8"
              - generic [ref=e655]: "├── span: gen_ai.chat (第 1 轮) 2.1s input 18,200 / output 240"
              - generic [ref=e657]: "├── span: tool.get_order_status 610ms"
              - generic [ref=e659]: "├── span: gen_ai.chat (第 2 轮) 1.9s input 2,300 / output 490"
              - generic [ref=e661]: "└── span: guardrails.output 90ms"
            - button "Copy to clipboard" [ref=e664] [cursor=pointer]
          - paragraph [ref=e666]: 这条 trace 直接回答成本问题：第 1 轮输入 18,200 token，其中稳定前缀值得进缓存；检索只取 8 条却贡献了大半输入量，说明切分过粗。
          - generic [ref=e667]:
            - heading "2. AI 网关：多模型时代的统一入口" [level=3] [ref=e668]
            - link "Section titled “2. AI 网关：多模型时代的统一入口”" [ref=e669] [cursor=pointer]:
              - /url: "#2-ai-网关多模型时代的统一入口"
          - paragraph [ref=e674]:
            - text: 应用同时使用多个模型供应商后，鉴权、限流、日志、失败切换在每个调用点重复出现。AI 网关把这些横切关注点收进统一入口。Cloudflare AI Gateway 的能力清单有代表性：请求分析与日志、缓存、限流、请求重试与模型回退。（来源：
            - link "Cloudflare AI Gateway overview" [ref=e675] [cursor=pointer]:
              - /url: "#source-cloudflare-ai-gateway"
            - text: ）
          - paragraph [ref=e676]: 网关层的路由能力也承担成本策略：简单请求路由到便宜的小模型，复杂请求升级到旗舰模型，供应商故障时自动切换备选。应用代码面对一个稳定端点，模型选择变成配置。
          - generic [ref=e677]:
            - heading "3. 成本优化：一笔可以算清的账" [level=3] [ref=e678]
            - link "Section titled “3. 成本优化：一笔可以算清的账”" [ref=e679] [cursor=pointer]:
              - /url: "#3-成本优化一笔可以算清的账"
          - paragraph [ref=e684]:
            - text: 推理成本按 token 计费，优化手段都围绕减少重复计算：提示缓存复用稳定前缀，模型分级把任务路由到够用的最小模型，批处理接口用延迟换折扣。提示缓存的收益可以直接计算。Anthropic 的官方倍率：5 分钟缓存写入为基础输入价的 1.25 倍，1 小时写入为 2 倍，缓存读取为 0.1 倍。（来源：
            - link "Prompt caching" [ref=e685] [cursor=pointer]:
              - /url: "#source-anthropic-prompt-caching"
            - text: ）
          - paragraph [ref=e686]: 设一个 20,000 token 的稳定前缀（系统提示 + 工具定义），5 分钟内被调用 100 次，基础输入价记为每 token 1 单位：
          - figure "提示缓存收支计算（前缀 20,000 token × 100 次调用）" [ref=e687]:
            - generic "提示缓存收支计算（前缀 20,000 token × 100 次调用），可横向滚动" [ref=e689]:
              - table [ref=e690]:
                - row [ref=e691]:
                  - columnheader "方案" [ref=e692]
                  - columnheader "计算" [ref=e693]
                  - columnheader "前缀总成本" [ref=e694]
                  - columnheader "相对成本" [ref=e695]
                - row [ref=e696]:
                  - cell "不用缓存" [ref=e697]
                  - cell "100 × 20,000 × 1.0" [ref=e698]
                  - cell "2,000,000 单位" [ref=e699]
                  - cell "100%" [ref=e700]
                - row [ref=e701]:
                  - cell "5 分钟缓存" [ref=e702]
                  - cell "1 次写 20,000 × 1.25 + 99 次读 20,000 × 0.1" [ref=e703]
                  - cell "25,000 + 198,000 = 223,000 单位" [ref=e704]
                  - cell "约 11%" [ref=e705]
          - paragraph [ref=e706]: 第 2 次调用就越过收支平衡点：写入多付的 25%，一次 0.1 倍的读取就赚回来了。前提是前缀逐字节稳定——把时间戳、用户 ID 放进前缀会让缓存永远无法命中，这是最常见的实现错误。
