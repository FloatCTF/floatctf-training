          - paragraph [ref=f7e775]: 一个 3×3 的卷积核就是一张 9 格的小模板。它在图像上滑动，每个位置计算一次「这一小块和模板有多匹配」。检测竖向笔画的模板，无论笔画出现在图片左上角还是右下角，都由同一个模板负责，这就是权重共享。
          - paragraph [ref=f7e776]: 二维卷积在每个位置复用同一个小核：
          - figure [ref=f7e778]:
            - code [ref=f7e780]:
              - generic [ref=f7e781]: H[i,j] = b + ΣₐΣᵦ K[a,b] · X[i+a, j+b]
            - button "Copy to clipboard" [ref=f7e784] [cursor=pointer]
          - paragraph [ref=f7e786]:
            - text: 局部连接减少参数，共享权重让同一模式能够在不同位置被检测。卷积层具有平移等变性；池化和全局聚合可以增加一定程度的位置不敏感性。（来源：
            - link "From Fully Connected Layers to Convolutions" [ref=f7e787] [cursor=pointer]:
              - /url: "#source-d2l-cnn"
            - text: ）
          - generic [ref=f7e788]:
            - heading "2. RNN 用隐藏状态携带顺序信息" [level=3] [ref=f7e789]
            - link "Section titled “2. RNN 用隐藏状态携带顺序信息”" [ref=f7e790] [cursor=pointer]:
              - /url: "#2-rnn-用隐藏状态携带顺序信息"
          - paragraph [ref=f7e795]:
            - text: 读句子时你会逐词往下读，记住前文再理解新词。RNN 把这个过程做成公式：每读一个输入，就把「至今为止的摘要」更新一次，这个摘要就是隐藏状态
            - code [ref=f7e796]: h
            - text: 。
          - figure [ref=f7e798]:
            - code [ref=f7e800]:
              - generic [ref=f7e801]: hₜ = φ(Wₓxₜ + Wₕhₜ₋₁ + b)
            - button "Copy to clipboard" [ref=f7e804] [cursor=pointer]
          - paragraph [ref=f7e806]:
            - text: 当前状态由当前输入和前一状态共同决定。反向传播需要沿时间展开计算图，长序列容易出现梯度消失或爆炸。门控 RNN、梯度裁剪和截断反向传播用于管理这些问题。（来源：
            - link "Recurrent Neural Networks" [ref=f7e807] [cursor=pointer]:
              - /url: "#source-d2l-rnn"
            - text: ）
          - generic [ref=f7e808]:
            - heading "3. Transformer 用注意力直接连接不同位置" [level=3] [ref=f7e809]
            - link "Section titled “3. Transformer 用注意力直接连接不同位置”" [ref=f7e810] [cursor=pointer]:
              - /url: "#3-transformer-用注意力直接连接不同位置"
          - paragraph [ref=f7e815]: RNN 读第 100 个词时要先读完前 99 个，无法并行；注意力让第 100 个词直接和任何位置建立联系，所有位置可以同时计算。代价是任意两词都要两两配对，序列越长计算量增长越快，这正是下一课会展开的 n² 问题。
          - paragraph [ref=f7e816]:
            - text: Transformer 用查询、键和值计算位置之间的相关性，并允许序列位置并行计算。原始架构还包含多头注意力、逐位置前馈层、残差连接、归一化和位置编码。（来源：
            - link "Attention Is All You Need" [ref=f7e817] [cursor=pointer]:
              - /url: "#source-vaswani-2017"
            - text: ）
          - paragraph [ref=f7e818]: 本课把 Transformer 放在架构地图中。下一课继续解释 token、embedding、Q/K/V、自注意力、因果遮罩、预训练和对齐。
          - generic [ref=f7e819]:
            - heading "七、部署后仍要验证数据和模型" [level=2] [ref=f7e820]
            - link "Section titled “七、部署后仍要验证数据和模型”" [ref=f7e821] [cursor=pointer]:
              - /url: "#七部署后仍要验证数据和模型"
          - paragraph [ref=f7e826]: 离线测试通过只说明模型在当前评估集上的表现。部署系统还会面对数据格式变化、特征管线差异、标签延迟和分布漂移。
          - figure "从训练到部署的持续检查" [ref=f7e827]:
