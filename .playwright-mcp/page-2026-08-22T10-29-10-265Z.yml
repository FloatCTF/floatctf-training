          - paragraph [ref=f7e856]:
            - text: Google 的生产 ML 监控指南要求分别检查原始数据、特征工程结果、标签泄漏、训练与服务偏差、数值稳定性和线上质量。（来源：
            - 'link "Production ML systems: Monitoring pipelines" [ref=f7e857] [cursor=pointer]':
              - /url: "#source-google-production-monitoring"
            - text: ）
          - paragraph [ref=f7e858]: 模型版本需要关联代码、数据、预处理器、超参数和评估报告。数据变化时，旧测试集会逐渐失去代表性；更新评估集需要保留稳定基准，才能区分模型变化和评估集变化。
