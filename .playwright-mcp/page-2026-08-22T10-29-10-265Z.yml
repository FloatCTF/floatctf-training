            - heading "重点结论" [level=2] [ref=f7e876]
            - paragraph [ref=f7e877]: 深度学习沿用损失、梯度和独立评估的训练闭环，用多层非线性变换学习表示。反向传播把损失传回每个参数，容量与正则化共同决定拟合程度，连接方式构成 MLP、CNN、RNN 与 Transformer 的主要差异。
