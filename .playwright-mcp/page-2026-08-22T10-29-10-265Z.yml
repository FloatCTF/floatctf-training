              - generic [ref=f7e203]: 1 1 0
            - button "Copy to clipboard" [ref=f7e206] [cursor=pointer]
          - paragraph [ref=f7e208]:
            - text: 带隐藏层和非线性激活的 MLP 可以先把输入映射到新的表示空间，再由输出层完成线性分类。下面的演示分三步走：先确认一条直线分不开这四个点，再看两个隐藏神经元怎样给每个点换一组坐标，最后在新坐标里用一条普通直线完成分类。TensorFlow Playground 用同样的思路展示网络结构如何改变可分性。（来源：
            - link "A Neural Network Playground" [ref=f7e209] [cursor=pointer]:
              - /url: "#source-tensorflow-playground"
            - text: ）
          - region [ref=f7e211]:
            - generic [ref=f7e212]:
              - paragraph [ref=f7e213]: XOR / 隐藏层存在的理由
              - heading "三步看懂：隐藏层到底做了什么" [level=3] [ref=f7e214]
              - paragraph [ref=f7e215]: XOR 的规则一句话：两个输入相同输出 0，不同输出 1。它是「一条直线分不开」的最简单例子。下面分三步演示：为什么一条直线不行，隐藏层做了什么，为什么换了坐标之后又行了。
            - generic [ref=f7e216]:
              - heading "第一步：一条直线分不开" [level=4] [ref=f7e217]
              - paragraph [ref=f7e218]: XOR 一共四种输入，每种是一个点，圆圈里的数字就是这组输入，颜色是正确答案。任务：转动直线，让每侧只剩一种颜色。图中两条虚线把同色的两点连成对角线。
              - figure "输入空间。拖动滑块旋转直线；虚线提示同色点的位置关系" [ref=f7e219]:
                - img "输入空间中的 XOR 四点、两条同色对角虚线与一条可旋转的直线" [ref=f7e220]:
                  - generic [ref=f7e221]: "0"
                  - generic [ref=f7e222]: "1"
                  - generic [ref=f7e223]: x₁（第一个输入）
                  - generic [ref=f7e224]: "0"
                  - generic [ref=f7e225]: "1"
                  - generic [ref=f7e226]: x₂
                  - generic [ref=f7e230]: "00"
                  - generic [ref=f7e233]: "01"
                  - generic [ref=f7e236]: "10"
                  - generic [ref=f7e239]: "11"
              - list [ref=f7e243]:
                - listitem [ref=f7e244]: 输出 0：输入相同（00、11）
                - listitem [ref=f7e246]: 输出 1：输入不同（01、10）
              - paragraph [ref=f7e248]: 静态模式显示 35°；交互模式可任意旋转验证。
              - paragraph [ref=f7e249]:
                - text: 当前 35°：直线一侧是
                - generic [ref=f7e250]: "00"
                - generic [ref=f7e251]: "01"
                - text: ，另一侧是
                - generic [ref=f7e252]: "10"
                - generic [ref=f7e253]: "11"
                - text: 。两侧始终混着两种颜色，分不开。
              - paragraph [ref=f7e254]: 原因就在那两条对角线上：同色的两点总在同一条对角线上，任何直线切开一条对角线的两点，另一条的必同样被切开。单条直线（也就是单层网络）到此为止。
            - generic [ref=f7e255]:
              - heading "第二步：隐藏层给每个点换坐标" [level=4] [ref=f7e256]
              - paragraph [ref=f7e257]: 隐藏层里的神经元，就是上一节你调过的加权打分器。这里放两个：h₁ 取 w₁=w₂=1、b=−0.5，问「至少一个输入是 1 吗」，就是 OR；h₂ 取 b=−1.5，问「两个都是 1 吗」，就是 AND。每个点用算出的 (h₁, h₂) 当新坐标，从左图搬进右图。
              - figure "同一个点，左边按 (x₁, x₂) 定位，右边按 (h₁, h₂) 定位。两个橙点被搬到同一位置" [ref=f7e259]:
                - img "四个点从输入空间搬进隐藏层空间的示意，01 与 10 被搬到同一位置" [ref=f7e260]:
