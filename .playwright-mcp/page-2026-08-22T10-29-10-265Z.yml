            - generic [ref=f7e339]:
              - heading "第三步：新坐标里一条直线就够" [level=4] [ref=f7e340]
              - paragraph [ref=f7e341]: 输出层还是上一课那条直线 wᵀx + b：取 w₁=1、w₂=−1、b=−0.5，也就是 h₁ − h₂ 大于 0.5 判为橙。三个位置全部判对。
              - figure "隐藏层空间。直线 h₁ − h₂ = 0.5：两个深蓝在一侧，重合的橙点在另一侧" [ref=f7e342]:
                - img "隐藏层空间中一条直线把两类点分开" [ref=f7e343]:
                  - generic [ref=f7e344]: "0"
                  - generic [ref=f7e345]: "1"
                  - generic [ref=f7e346]: h₁ = OR（至少一个 1）
                  - generic [ref=f7e347]: "0"
                  - generic [ref=f7e348]: "1"
                  - generic [ref=f7e349]: h₂
                  - generic [ref=f7e351]: h₁ − h₂ = 0.5
                  - generic [ref=f7e352]: "00"
                  - generic [ref=f7e355]: "11"
                  - generic [ref=f7e358]: 01·10
              - paragraph [ref=f7e362]: 输出层没有变聪明，是隐藏层把坐标换好了。真实网络里没人手挑 OR 和 AND，梯度下降在训练中自动找到类似的变换，「深度学习学的是表示」说的就是这件事。第一节说的「非线性激活画出弯曲边界」和这里的「把点搬进直线够用的空间」是同一件事的两种说法。
            - paragraph [ref=f7e364]: 三步连起来：一条直线分不开 → 隐藏层换坐标 → 一条直线就够。多层网络的能力来自「堆叠变换，最后一步线性分类」。
          - complementary "先建立直觉" [ref=f7e365]:
            - paragraph [ref=f7e366]: INTUITION
            - heading "先建立直觉" [level=2] [ref=f7e367]
            - paragraph [ref=f7e368]: 每一层重新组合上一层的数值表示。图像模型的早期层可能对局部边缘敏感，后续层再组合纹理与形状。具体含义需要通过激活可视化、探针和消融分析验证。
