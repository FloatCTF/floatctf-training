              - paragraph [ref=f7e111]: 把神经元想成一位评委：两科成绩各乘一个权重（重要程度），加起来再减一道门槛（偏置），得到总分 z；ReLU 决定「负分直接判 0」。拖动下面的滑块，看连线粗细（权重大小）、颜色（正=加分，蓝=扣分）和输出怎样联动。
            - generic [ref=f7e112]:
