              - paragraph [ref=f7e64]: 深度学习沿用损失、梯度和独立评估的训练闭环，把单层变换换成多层非线性变换。反向传播把损失传回每个参数，连接方式构成 MLP、CNN、RNN 与 Transformer 的主要差异。
