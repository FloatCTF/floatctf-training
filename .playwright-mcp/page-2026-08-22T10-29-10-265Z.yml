          - paragraph [ref=f7e188]:
            - text: 夹在输入和输出之间的层叫
            - strong [ref=f7e189]: 隐藏层
            - text: ：「隐藏」不是说保密，而是说这些层的输出没有直接对应任何人给定的含义，它们是训练过程自己造出来的中间表示。
          - paragraph [ref=f7e190]: XOR 四个点无法用一条直线分开：
          - figure [ref=f7e192]:
            - code [ref=f7e194]:
              - generic [ref=f7e195]: x₁ x₂ y
              - generic [ref=f7e197]: 0 0 0
              - generic [ref=f7e199]: 0 1 1
