          - paragraph [ref=e90]: 先看一个具体任务：识别手写数字。一张 28×28 像素的手写「3」，在计算机眼里是 784 个亮度数字（0 全白、1 全黑）。要让程序说出「这是 3」，需要一条从 784 个数字到 10 个类别的映射规则。这条规则没法用 if-else 写出来：每个人的「3」写法都不同，你无法枚举所有情况。
          - paragraph [ref=e91]:
            - text: 上一课学到的模型核心仍是一条直线：线性回归用
            - code [ref=e92]: wx + b
            - text: 预测数值，逻辑回归用
            - code [ref=e93]: wᵀx + b
            - text: 加 sigmoid 输出概率。直线把输入空间切成两半，而 XOR 四个点、图像中的数字笔画、句子里相隔很远的指代关系，都不服从这种划分。
          - paragraph [ref=e94]: 训练闭环本身不需要更换。数据、损失、梯度、优化器和独立评估继续工作，改变的是模型内部的结构：把单层变换换成多层非线性变换，让网络在训练中组合出有用的中间表示。本课沿四个问题展开：多层结构为什么能表达更复杂的关系，参数量怎样计算与控制，梯度怎样到达每一层参数，四类架构分别适合什么数据。
