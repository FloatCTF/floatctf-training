          - paragraph [ref=e671]: 一个 3×3 的卷积核就是一张 9 格的小模板。它在图像上滑动，每个位置计算一次「这一小块和模板有多匹配」。检测竖向笔画的模板，无论笔画出现在图片左上角还是右下角，都由同一个模板负责，这就是权重共享。
          - paragraph [ref=e672]: 二维卷积在每个位置复用同一个小核：
          - figure [ref=e674]:
