            - text: 当前状态由当前输入和前一状态共同决定。反向传播需要沿时间展开计算图，长序列容易出现梯度消失或爆炸。门控 RNN、梯度裁剪和截断反向传播用于管理这些问题。（来源：
            - link "Recurrent Neural Networks" [ref=e703] [cursor=pointer]:
              - /url: "#source-d2l-rnn"
            - text: ）
          - generic [ref=e704]:
            - heading "3. Transformer 用注意力直接连接不同位置" [level=3] [ref=e705]
            - link "Section titled “3. Transformer 用注意力直接连接不同位置”" [ref=e706] [cursor=pointer]:
              - /url: "#3-transformer-用注意力直接连接不同位置"
          - paragraph [ref=e711]: RNN 读第 100 个词时要先读完前 99 个，无法并行；注意力让第 100 个词直接和任何位置建立联系，所有位置可以同时计算。代价是任意两词都要两两配对，序列越长计算量增长越快，这正是下一课会展开的 n² 问题。
          - paragraph [ref=e712]:
            - text: Transformer 用查询、键和值计算位置之间的相关性，并允许序列位置并行计算。原始架构还包含多头注意力、逐位置前馈层、残差连接、归一化和位置编码。（来源：
