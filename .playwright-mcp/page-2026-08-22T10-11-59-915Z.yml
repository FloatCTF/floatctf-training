          - paragraph [ref=e682]:
            - text: 局部连接减少参数，共享权重让同一模式能够在不同位置被检测。卷积层具有平移等变性；池化和全局聚合可以增加一定程度的位置不敏感性。（来源：
            - link "From Fully Connected Layers to Convolutions" [ref=e683] [cursor=pointer]:
