            - code [ref=e104]: w
            - text: 是每个输入的权重，
            - code [ref=e105]: b
            - text: 是基础分。神经元只是把这个想法推广到多个输入：每个输入有自己的权重，全部加权求和，再加上偏置，然后经过一个激活函数决定输出。
